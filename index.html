function migrateEngines(x){for(let b of x.boats){if(b.engineLayoutVersion!==2){if(b.id==='kismet'){b.engineType='Twin Yanmar diesel • 57 HP each';b.portEngineHP=57;b.starboardEngineHP=57}b.portEngineHours??='';b.starboardEngineHours??='';b.engineLayoutVersion=2}if(b.generatorLayoutVersion!==1){if(b.id==='kismet')b.generatorMake??='Cummins';b.generatorModel??='';b.generatorKW??='';b.generatorHours??='';b.generatorLayoutVersion=1}}return x}
const knownHours=v=>v!==''&&v!=null&&Number.isFinite(Number(v)), hourText=v=>knownHours(v)?num(v)+' h':'Not entered';
function currentHours(side){let b=boat(),p=b.portEngineHours,s=b.starboardEngineHours;if(side==='Generator')return knownHours(b.generatorHours)?Number(b.generatorHours):null;if(side==='Port engine')return knownHours(p)?Number(p):null;if(side==='Starboard engine')return knownHours(s)?Number(s):null;if(side==='Both engines'){let hs=[p,s].filter(knownHours).map(Number);return hs.length?Math.max(...hs):null}return knownHours(b.engineHours)&&Number(b.engineHours)>0?Number(b.engineHours):null}
function remainingHours(a){let h=currentHours(a.engineSide);return h!==null&&knownHours(a.dueEngineHours)?Number(a.dueEngineHours)-h:null}
function toast(msg){$('#toast').textContent=msg;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,4200)}
async function openDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open('boatvault-personal-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('data');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function persist(next=state,opts={}){if(!opts.raw)stampChanges(state,next);return new Promise((resolve,reject)=>{let tx=db.transaction('data','readwrite');tx.objectStore('data').put(next,'state');tx.oncomplete=()=>{state=next;$('#saveState').textContent='Saved on this device • '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});if(!opts.raw)scheduleSync();resolve()};tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
function go(v){view=v;query='';render()}
function status(a){if(a.status&&a.status!=='open')return{label:a.status==='completed'?'Completed':'Dismissed',css:''};let dt=a.dueDate?Math.round((new Date(a.dueDate+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000):null,hr=remainingHours(a);if((dt!==null&&dt<0)||(hr!==null&&hr<=0))return{label:'Due now',css:'bad'};if(dt!==null&&dt<=Number(knownHours(a.notifyBeforeDays)?a.notifyBeforeDays:state.preferences.reminderWindow))return{label:dt===0?'Due today':`In ${dt} days`,css:'warn'};return{label:hr!==null?`${num(hr)} hours remaining`:knownHours(a.dueEngineHours)?'Enter engine hours':'Upcoming',css:''}}
function reminders(){let auto=[];records('maintenance').forEach(r=>{if(r.nextDueDate||(r.nextDueEngineHours!==''&&r.nextDueEngineHours!=null))auto.push({id:'m-'+r.id,source:'maintenance',sourceId:r.id,engineSide:r.engineSide,title:r.serviceType,alertType:'Maintenance',dueDate:r.nextDueDate,dueEngineHours:r.nextDueEngineHours,status:r.reminderStatus||'open'})});records('documents').filter(r=>r.expirationDate).forEach(r=>auto.push({id:'d-'+r.id,source:'documents',sourceId:r.id,title:r.documentName+' renewal',alertType:r.category,dueDate:r.expirationDate,status:r.reminderStatus||'open'}));return [...records('alerts').map(r=>({...r,source:'alerts',sourceId:r.id})),...auto].sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'))}
function upcoming(){return reminders().filter(a=>a.status==='open'&&(status(a).css||a.dueEngineHours!=null&&a.dueEngineHours!==''&&remainingHours(a)!==null&&remainingHours(a)<=10))}
const btn=(text,action,primary=false)=>`<button class="btn ${primary?'primary':''}" onclick="${action}">${text}</button>`, badge=a=>{let s=status(a);return `<span class="badge ${s.css}">${esc(s.label)}</span>`}, empty=(title,description,action)=>`<div class="empty"><strong>${title}</strong>${description}${action?`<div>${action}</div>`:''}</div>`;

function stat(label,value,link,note){return `<div class="card stat"><div class="label">${label}</div><div class="value">${value}</div><a href="#${link}" onclick="event.preventDefault();go('${link}')">${note}</a></div>`}
function dashboard(){let b=boat(),up=upcoming(),yr=new Date().getFullYear(),costs=spendingEntries(),ex=costs.filter(r=>r.date?.startsWith(String(yr)));return `<div class="profile-banner"><div><div class="eyebrow">YOUR VESSEL</div><h2>${esc(b.boatName)}</h2><p>${esc(b.year)} ${esc(b.make)} ${esc(b.model)}</p></div><div class="specs"><div><strong>${num(b.lengthFeet)} ft</strong><small>Length overall</small></div><div><strong>${hourText(b.portEngineHours)}</strong><small>Port engine · ${num(b.portEngineHP)} HP</small></div><div><strong>${hourText(b.starboardEngineHours)}</strong><small>Starboard engine · ${num(b.starboardEngineHP)} HP</small></div><div><strong>${num(b.beam)} ft</strong><small>Beam</small></div><div><strong>${hourText(b.generatorHours)}</strong><small>${esc(b.generatorMake||'Generator')} generator</small></div></div></div><div class="stats">${stat('Upcoming reminders',up.length,'alerts',up.length?'Review due items':'All caught up')}${stat('Documents stored',records('documents').length,'documents','Open your vault')}${stat('All-time spending',money(spendingTotal(costs)),'expenses','Maintenance, fuel & expenses')}${stat('Service records',records('maintenance').length,'maintenance','View maintenance history')}</div><section class="card" style="margin-bottom:20px"><div class="section-head"><h2>${yr} spending: ${money(spendingTotal(ex))}</h2>${btn("View all costs", "go('expenses')")}</div><p class="muted">Includes maintenance, fuel purchases, and other expenses for ${esc(b.boatName)}.</p>${costs.length?`<h3>Latest costs</h3>${costs.slice(-4).reverse().map(r=>`<div class="row"><div><strong>${esc(r.title)}</strong><small>${date(r.date)} · ${esc(labels[r.source])}${!r.included?' · Excluded from totals':''}</small></div><strong>${money(r.amount)}</strong></div>`).join('')}`:empty('No spending recorded yet','Service and fuel costs will appear here automatically.',btn('Add expense',"edit('expenses')"))}</section><div class="grid"><section class="card"><div class="section-head"><h2>On the horizon</h2>${btn('All reminders',"go('alerts')")}</div>${up.length?up.slice(0,5).map(a=>`<div class="row"><div><h3>${esc(a.title)}</h3><small>${esc(a.alertType)} · ${a.dueDate?date(a.dueDate):'Hour-based reminder'}</small></div>${badge(a)}</div>`).join(''):empty('No reminders due','Add service intervals or document expirations to see what’s coming.',btn('Add reminder',"edit('alerts')"))}</section><section class="card"><div class="section-head"><h2>Recent maintenance</h2>${btn('View history',"go('maintenance')")}</div>${records('maintenance').length?records('maintenance').sort((a,b)=>b.serviceDate.localeCompare(a.serviceDate)).slice(0,4).map(r=>`<div class="row"><div><h3>${esc(r.serviceType)}</h3><small>${date(r.serviceDate)} · ${esc(r.vendorName||'No provider entered')}</small></div><strong>${moneyR(r,r.cost)}</strong></div>`).join(''):empty('Start Kismet’s service history'.replace('Kismet',esc(b.boatName)),'Keep every service, provider, and next due date in one place.',btn('Log service',"edit('maintenance')"))}</section></div>${logSummary()}${hasData()&&!(syncCfg?.lastSync&&Date.now()-new Date(syncCfg.lastSync)<7*86400000)&&(backupAge()===null||backupAge()>30)?`<div class="notice" style="background:#fff1db;color:#7a4a00;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span>${backupAge()===null?'You have not downloaded a backup yet.':`Last backup was ${backupAge()} days ago.`} Your records live only in this browser.</span>${btn('Download backup now','backup()',true)}</div>`:`<div class="notice">${syncCfg?.lastSync?'Synced with Google Drive '+new Date(syncCfg.lastSync).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'.':'Records and files are saved on this device.'} Last backup: ${date(state.preferences.lastBackup)||'—'}.</div>`}`}
function filtered(t){return records(t).filter(r=>Object.values(r).some(v=>typeof v==='string'&&!v.startsWith('data:')&&v.toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>(b.serviceDate||b.expenseDate||b.date||'').localeCompare(a.serviceDate||a.expenseDate||a.date||''))}
function searchbar(){return `<div class="toolbar"><input aria-label="Search records" placeholder="Search records…" value="${esc(query)}" oninput="query=this.value;refreshResults()"><span class="muted" style="font-size:14px">${records(view).length} records</span></div>`}
function recordActions(t,r){return `<div class="actions">${btn('Edit',`edit('${t}','${esc(r.id)}')`)}${btn('Delete',`removeRecord('${t}','${esc(r.id)}')`)}</div>`}
function table(t){let data=filtered(t);if(!data.length)return empty(query?'No matching records':'No records yet',query?'Try another search.':'Add your first entry to begin.',!query?btn('Add entry',`edit('${t}')`):'');let heads=t==='maintenance'?['Service','Date','Hours','Cost','Next due','']:t==='expenses'?['Category / vendor','Date','Amount','Notes','']:['Location','Date','Gallons','Price / gal','Total','Engine hours',''];return `<div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${data.map(r=>`<tr>${t==='maintenance'?`<td><strong>${esc(r.serviceType)}</strong><div class="muted">${esc(r.vendorName)}</div><div class="muted">${esc(r.engineSide||'Vessel / other equipment')}</div>${attLinks(t,r)}</td><td>${date(r.serviceDate)}</td><td>${r.engineHours!==''&&r.engineHours!=null?num(r.engineHours):'—'}</td><td>${moneyR(r,r.cost)}</td><td>${date(r.nextDueDate)}${r.nextDueEngineHours!==''&&r.nextDueEngineHours!=null?`<div>${num(r.nextDueEngineHours)} h</div>`:''}${recurLine(r.intervalMonths,r.intervalHours)}</td>`:t==='expenses'?`<td><strong>${esc(r.category)}</strong><div class="muted">${esc(r.vendor)}</div>${attLinks(t,r)}</td><td>${date(r.expenseDate)}</td><td><strong>${moneyR(r,r.amount)}</strong></td><td>${esc(r.notes)}</td>`:`<td><strong>${esc(r.location||'Fuel purchase')}</strong>${attLinks(t,r)}</td><td>${date(r.date)}</td><td>${num(r.gallons)}</td><td>${moneyIn(r.pricePerGallon,r.currency)}</td><td><strong>${moneyR(r,r.totalCost)}</strong></td><td>Port: ${hourText(r.portEngineHours)}<br>Starboard: ${hourText(r.starboardEngineHours)}${knownHours(r.engineHours)?'<br>Previous reading: '+num(r.engineHours)+' h':''}</td>`}<td>${recordActions(t,r)}</td></tr>`).join('')}</tbody></table></div>`}

function refreshResults(){let el=$('#results');el.innerHTML=view==='documents'?documentCards():view==='expenses'?spendingTable(periodSpending(),query):table(view)}

function documentCards(){let rows=filtered('documents');return rows.length?`<div class="cards">${rows.map(r=>`<article class="card doc-card"><div class="section-head"><div class="doc-icon">${esc(r.fileType||'FILE')}</div><span class="badge">${esc(r.category)}</span></div><h3>${esc(r.documentName)}</h3><div class="muted" style="font-size:14px">${esc(r.fileName)} · ${num(r.fileSize/1024)} KB</div>${r.expirationDate?`<div>Expires ${date(r.expirationDate)}</div>`:''}${r.notes?`<p class="muted">${esc(r.notes)}</p>`:''}<div class="actions">${btn('View',`viewDoc('${esc(r.id)}')`)}${btn('Download',`downloadDoc('${esc(r.id)}')`)}${btn('Edit',`edit('documents','${esc(r.id)}')`)}${btn('Delete',`removeRecord('documents','${esc(r.id)}')`)}</div></article>`).join('')}</div>`:empty(query?'No matching documents':'Your vault is ready','Upload insurance, registration, manuals, surveys, or receipts.',btn('Upload document',"edit('documents')",true))}
function spendingEntries(){let entries=[];for(let t of ['expenses','maintenance','fuel']){for(let r of records(t)){let val=t==='expenses'?r.amount:t==='maintenance'?r.cost:r.totalCost;if(val===''||val==null||!Number.isFinite(Number(val)))continue;entries.push({id:r.id,source:t,record:r,date:t==='expenses'?r.expenseDate:t==='maintenance'?r.serviceDate:r.date,amount:usdOf(r,val),origAmount:Number(val),currency:r.currency||'USD',orig:foreign(r)?moneyIn(val,r.currency):'',included:r.includeInTotals!==false,title:t==='expenses'?(r.notes||r.category):t==='maintenance'?r.serviceType:(r.location||'Fuel purchase'),category:t==='expenses'?r.category:t==='maintenance'?'Maintenance':'Fuel',vendor:t==='expenses'?r.vendor:t==='maintenance'?r.vendorName:r.location})}}return entries.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.source+':'+a.id).localeCompare(b.source+':'+b.id))}
function spendingTotal(entries){return entries.reduce((n,r)=>n+(r.included?r.amount:0),0)}
function periodSpending(){return spendingEntries().filter(r=>spendingYear==='all'||r.date?.startsWith(spendingYear))}
function spendingTable(entries,search=''){let total=0,rows=entries.map(r=>{total+=r.included?r.amount:0;return {...r,running:total}}).filter(r=>[r.title,r.category,r.vendor,r.date,labels[r.source],r.record.engineSide].some(v=>String(v||'').toLowerCase().includes(search.toLowerCase()))).reverse();if(!rows.length)return empty(search?'No matching costs':'No costs recorded','Add an expense, a service cost, or a fuel purchase.',btn('Add expense',"edit('expenses')"));return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Description / vendor</th><th>Recorded in</th><th>Cost</th><th>Running total</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${date(r.date)}</td><td><strong>${esc(r.title)}</strong><div class="muted">${esc(r.vendor)}${r.record.engineSide?' · '+esc(r.record.engineSide):''}</div><div class="muted">${esc(r.category)}</div>${attLinks(r.source,r.record)}</td><td><span class="badge">${esc(labels[r.source])}</span>${!r.included?'<div class="badge warn">Excluded from totals</div>':''}</td><td>${money(r.amount)}${r.orig?`<div class="muted" style="font-size:12px">${r.orig}</div>`:''}</td><td><strong>${money(r.running)}</strong></td><td>${recordActions(r.source,r.record)}</td></tr>`).join('')}</tbody></table></div>`}
function expenseView(){let all=spendingEntries(),period=periodSpending(),groups={},total=spendingTotal(period),years=[...new Set([String(new Date().getFullYear()),...all.map(r=>r.date?.slice(0,4)).filter(Boolean)])].sort().reverse();period.filter(r=>r.included).forEach(r=>groups[r.category]=(groups[r.category]||0)+r.amount);return `<div class="toolbar"><label>Period<select aria-label="Spending period" onchange="spendingYear=this.value;render()"><option value="all" ${spendingYear==='all'?'selected':''}>All time</option>${years.map(y=>`<option value="${esc(y)}" ${spendingYear===y?'selected':''}>${esc(y)}</option>`).join('')}</select></label></div><div class="stats">${stat(spendingYear==='all'?'All-time spending':spendingYear+' spending',money(total),'expenses',period.filter(r=>r.included).length+' included costs')}${stat('Maintenance',money(spendingTotal(period.filter(r=>r.source==='maintenance'))),'maintenance','Included in spending total')}${stat('Fuel log',money(spendingTotal(period.filter(r=>r.source==='fuel'))),'fuel','Included in spending total')}${stat('Other expense entries',money(spendingTotal(period.filter(r=>r.source==='expenses'))),'expenses','Included in spending total')}</div>${Object.keys(groups).length?`<section class="card" style="margin-bottom:20px"><h2>Spending by category</h2>${Object.entries(groups).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><div style="flex:1">${esc(k)}<div class="bar"><i style="width:${total?v/total*100:0}%"></i></div></div><strong>${money(v)}</strong></div>`).join('')}</section>`:''}<section class="card"><div class="section-head"><h2>All costs & running total</h2>${btn('Export spending CSV','spendingCSV()')}</div><div class="toolbar"><input aria-label="Search spending" placeholder="Search costs, providers, or equipment…" value="${esc(query)}" oninput="query=this.value;refreshResults()"></div><div id="results">${spendingTable(period,query)}</div></section><div class="notice">Maintenance and fuel purchases are included automatically. Enter each purchase once. If the same purchase was entered in two places, edit one copy and uncheck “Include cost in spending totals.” The running total follows date order within the selected period; search does not change totals.</div>`}

function logVessel(){return `<section class="card"><h2>Logbook vessel details</h2><p class="muted">Details preserved from your logbook workbook. Kismet’s technical profile (engines, generator, hull) lives in Boat profile.</p><div class="profile-fields">${log().vessel.map((r,i)=>`<div><small>${esc(r[0])}</small><strong>${esc(r[1])||'—'}</strong><div style="margin-top:8px">${btn('Edit',`editLog('vessel',${i})`)}</div></div>`).join('')}</div></section>`}
function logReference(){return `<div class="grid"><section class="card"><h2>Logbook abbreviations</h2><div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Code / field</th><th>Meaning</th></tr></thead><tbody>${log().reference.map(r=>`<tr><td><strong>${esc(r[0])}</strong></td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table></div></section><section class="card"><h2>How the log works</h2><p class="muted" style="font-size:14px"><strong>Totals.</strong> Passages count nonempty dates, matching the Excel COUNTA. Distance, underway hours and days sum their numeric fields. Kismet totals include entries whose boat name is Kismet. Review flags scan every field for “VERIFY” or “unclear”.</p><p class="muted" style="font-size:14px"><strong>Backups.</strong> The complete backup in Settings & backup includes the captain’s log and credential photos. <strong>Export log backup</strong> saves the log alone in the original Captain’s Logbook format, which the standalone logbook can still import.</p><p class="muted" style="font-size:14px"><strong>Photos.</strong> Large images are resized to 1,800 pixels on the longest side. Keep your full-resolution originals separately.</p><p class="muted" style="font-size:14px"><strong>Source details.</strong> Original date text such as “0/2/2026”, spellings and tonnage values are unchanged. This record was transcribed from handwritten pages; review flagged entries against the originals before any formal licensing application.</p></section></div>`}
function editLog(kind,index){let head=LOG_HEAD[kind],r=index<0?Array(head.length).fill(''):log()[kind][index];editInfo={t:'log',kind,index};$('#formTitle').textContent=(index<0?'Add ':'Edit ')+(kind==='passages'?'passage':kind==='vessel'?'vessel detail':'certification');$('#fields').innerHTML=head.map((h,i)=>{let numeric=kind==='passages'&&LOG_NUM.includes(i),long=/Notes|Conditions|Address|Sea\/Weather/.test(h);return `<label class="${long?'full':''}">${esc(h)}${kind==='passages'&&i===0?' *':''}${long?`<textarea name="f${i}">${esc(r[i])}</textarea>`:`<input name="f${i}" type="${numeric?'number':'text'}" ${numeric?'min="0" step="any"':''} ${kind==='passages'&&i===0?'required placeholder="MM/DD/YYYY or original date text"':''} value="${esc(r[i])}">`}</label>`}).join('');$('#formError').textContent='';$('#saveButton').disabled=false;$('#editor').showModal()}

function readImage(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Could not read '+file.name));r.readAsDataURL(file)})}
async function preparePhoto(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Use JPEG, PNG or WebP. Convert HEIC images to JPEG first.');if(file.size>25*1024*1024)throw Error(file.name+' is larger than 25 MB.');let url=await readImage(file),img=await new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error('Could not open '+file.name));im.src=url}),scale=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);return{name:file.name,url:c.toDataURL('image/jpeg',0.9),addedAt:new Date().toISOString()}}
$('#credentialFiles').onchange=async e=>{let files=[...e.target.files],i=photoTarget;e.target.value='';if(!files.length||i===null||photoBusy)return;if(lphotos(i).length+files.length>100)return toast('Limit of 100 photos per credential.');photoBusy=true;toast('Preparing credential photos…');try{let prepared=[];for(let f of files)prepared.push(await preparePhoto(f));let L=structuredClone(log());L.credentialPhotos=L.credentialPhotos||[];while(L.credentialPhotos.length<L.certifications.length)L.credentialPhotos.push([]);L.credentialPhotos[i].push(...prepared);await saveLog(L);render();toast('Credential photos added.')}catch(err){toast('Photos were not added: '+err.message)}finally{photoBusy=false}};

function passagesCSV(){let lines=[LOG_HEAD.passages,...logRows().map(x=>x.r)];download(new Blob(['﻿'+lines.map(l=>l.map(v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'Kismet_Passages_'+today()+'.csv')}
const SYNC_COLS=['boats','maintenance','documents','expenses','fuel','alerts'],BLOB_COLS=['maintenance','expenses','fuel'];
let syncCfg=null,syncing=false,syncTimer=null,syncMsg='',hashCache=new Map();
function recChanged(a,b){if(a===b)return false;for(let k of new Set([...Object.keys(a||{}),...Object.keys(b||{})]))if(k!=='_mt'&&a?.[k]!==b?.[k])return true;return false}
function stampChanges(prev,next){if(!prev||prev===next)return;let now=new Date().toISOString();next.sync={...(next.sync||{}),deleted:{...(prev.sync?.deleted||{}),...(next.sync?.deleted||{})}};for(let c of SYNC_COLS){let pm=new Map((prev[c]||[]).map(r=>[r.id,r])),ids=new Set();for(let r of next[c]||[]){ids.add(r.id);let o=pm.get(r.id);if(!o||recChanged(o,r))r._mt=now}for(let id of pm.keys())if(!ids.has(id))next.sync.deleted[id]=now}if(next.preferences&&recChanged(prev.preferences,next.preferences))next.preferences._mt=now;if(next.logbook&&next.logbook!==prev.logbook&&String(next.logbook.updatedAt||'')<=String(prev.logbook?.updatedAt||''))next.logbook.updatedAt=now}
function blobId(s){if(hashCache.has(s))return hashCache.get(s);let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){let c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);let id='h'+(h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0')+'_'+s.length;if(hashCache.size>500)hashCache.clear();hashCache.set(s,id);return id}
function mapBlobs(x,fn){let o={...x,documents:(x.documents||[]).map(r=>r.fileData?{...r,fileData:fn(r.fileData)}:r)};for(let c of BLOB_COLS)o[c]=(x[c]||[]).map(r=>r.attachments?.length?{...r,attachments:r.attachments.map(a=>({...a,data:fn(a.data)}))}:r);if(x.logbook)o.logbook={...x.logbook,credentialPhotos:(x.logbook.credentialPhotos||[]).map(l=>l.map(p=>({...p,url:fn(p.url)})))};return o}
function extractBlobs(x){let pool=new Map(),payload=mapBlobs(x,v=>{if(typeof v!=='string'||!v.startsWith('data:'))return v;let id=blobId(v);pool.set(id,v);return 'bvref:'+id});delete payload.activeBoat;return{payload,pool}}
function blobRefs(p){let ids=new Set();mapBlobs(p,v=>{if(typeof v==='string'&&v.startsWith('bvref:'))ids.add(v.slice(6));return v});return ids}
function mergeStates(L,R){if(!R)return L;let del={...(R.sync?.deleted||{})};for(let [k,v] of Object.entries(L.sync?.deleted||{}))if(!del[k]||v>del[k])del[k]=v;let out={...L,sync:{...(L.sync||{}),deleted:del}};for(let c of SYNC_COLS){let m=new Map();for(let r of R[c]||[])m.set(r.id,r);for(let r of L[c]||[]){let o=m.get(r.id);if(!o||String(r._mt||'')>String(o._mt||''))m.set(r.id,r)}out[c]=[...m.values()].filter(r=>!(del[r.id]&&del[r.id]>=String(r._mt||'')))}if(!out.boats.length)out.boats=(L.boats.length?L.boats:R.boats);out.preferences=String(L.preferences?._mt||'')>String(R.preferences?._mt||'')?L.preferences:(R.preferences||L.preferences);out.logbook=String(L.logbook?.updatedAt||'')>String(R.logbook?.updatedAt||'')?L.logbook:(R.logbook||L.logbook);out.version=1;return out}
async function loadSyncCfg(){try{syncCfg=await new Promise((res,rej)=>{let q=db.transaction('data').objectStore('data').get('syncConfig');q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}catch(e){syncCfg=null}}
async function saveSyncCfg(c){await new Promise((res,rej)=>{let tx=db.transaction('data','readwrite');c?tx.objectStore('data').put(c,'syncConfig'):tx.objectStore('data').delete('syncConfig');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});syncCfg=c}
async function syncApi(body,cfg=syncCfg){let ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),body.action==='pull'||body.action==='push'?60000:180000);try{let r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,key:cfg.key}),redirect:'follow',signal:ctl.signal});if(!r.ok)throw new Error('Google returned error '+r.status+'. Check the sync web app URL.');let j;try{j=await r.json()}catch(e){throw new Error('Unexpected reply. Check the web app is deployed with access set to “Anyone”.')}if(!j.ok&&!j.conflict)throw new Error(j.error||'Sync failed.');return j}catch(e){if(e.name==='AbortError')throw new Error('Connection timed out.');if(e instanceof TypeError)throw new Error('Could not reach Google Drive. Check your connection and the web app URL.');throw e}finally{clearTimeout(t)}}
function syncText(){if(!syncCfg)return '';if(syncing)return 'Syncing with Google Drive…';if(syncMsg)return syncMsg;return syncCfg.lastSync?'Synced with Google Drive • '+new Date(syncCfg.lastSync).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'Not synced yet'}
function showSync(){let t=syncText();$('#syncState').textContent=t?' • '+t:'';let d=$('#syncDetail');if(d)d.textContent=t}
function scheduleSync(delay=3000){if(!syncCfg)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(false),delay)}
async function syncNow(manual){if(!syncCfg)return manual&&toast('Connect Google Drive sync in Settings first.');if(syncing){if(manual)toast('Sync already in progress.');return}if(!navigator.onLine){syncMsg='Offline • changes will sync when you are back online';showSync();if(manual)toast('You are offline. Changes are saved on this device and will sync later.');return}syncing=true;syncMsg='';showSync();try{for(let attempt=0;attempt<4;attempt++){let base=state,local=extractBlobs(base),remote=await syncApi({action:'pull'}),rp=remote.data?JSON.parse(remote.data):null,merged=mergeStates(local.payload,rp),have=new Set(remote.blobs||[]),refs=blobRefs(merged),mergedText=JSON.stringify(merged);for(let id of refs)if(!have.has(id)&&local.pool.has(id)){syncMsg='Uploading files…';showSync();await syncApi({action:'putBlob',id,data:local.pool.get(id)});have.add(id)}if(mergedText!==remote.data){let res=await syncApi({action:'push',baseVersion:remote.version,payload:merged});if(res.conflict)continue}let pool=local.pool;for(let id of refs)if(!pool.has(id)){syncMsg='Downloading files…';showSync();pool.set(id,(await syncApi({action:'getBlob',id})).data)}if(state!==base){syncMsg='';scheduleSync(500);return}if(mergedText!==JSON.stringify(local.payload)){let next=mapBlobs(merged,v=>typeof v==='string'&&v.startsWith('bvref:')?pool.get(v.slice(6)):v);next.activeBoat=next.boats.some(b=>b.id===base.activeBoat)?base.activeBoat:next.boats[0].id;await persist(next,{raw:true});if(!$('#editor').open)render()}syncMsg='';await saveSyncCfg({...syncCfg,lastSync:new Date().toISOString()});if(manual)toast('Synced with Google Drive.');return}throw new Error('Google Drive was busy. Try again in a minute.')}catch(e){syncMsg='Sync problem: '+e.message;if(manual)toast(syncMsg)}finally{syncing=false;showSync();if(view==='settings'||view==='dashboard'){let d=$('#syncDetail');if(d)d.textContent=syncText()}}}
async function connectSync(){let url=$('#syncUrl').value.trim(),key=$('#syncKey').value.trim();if(!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(url))return toast('Paste the full web app URL. It starts with https://script.google.com/ and ends with /exec.');if(key.length<20)return toast('Paste the full sync key from the Apps Script log.');toast('Connecting to Google Drive…');try{await syncApi({action:'pull'},{url,key});await saveSyncCfg({url,key,lastSync:null});render();await syncNow(true)}catch(e){toast('Could not connect: '+e.message)}}
async function disconnectSync(){if(!confirm('Disconnect this device from Google Drive sync? Records stay on this device and in Drive; they just stop syncing here.'))return;await saveSyncCfg(null);syncMsg='';render();showSync();toast('Sync disconnected on this device.')}
function syncCard(){return `<section class="card"><h2>Google Drive sync</h2><p>Keeps this device in step with your other devices through the “BoatVault Sync” folder in your Google Drive. Records and files sync automatically when the app opens, after each change, and when you come back online.</p>${syncCfg?`<p><strong>Status:</strong> <span id="syncDetail">${esc(syncText())}</span></p><div class="actions">${btn('Sync now','syncNow(true)',true)}${btn('Disconnect this device','disconnectSync()')}</div>`:`<div class="form-grid" style="margin-top:14px"><label class="full">Sync web app URL<input id="syncUrl" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec"></label><label class="full">Sync key<input id="syncKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></label></div><div class="actions">${btn('Connect & sync','connectSync()',true)}</div>`}</section>`}
function bumpHours(next,r,t){let b=next.boats.find(x=>x.id===r.boatId);if(!b)return false;let changed=false,set=(k,v)=>{if(knownHours(v)&&(!knownHours(b[k])||Number(v)>Number(b[k]))){b[k]=Number(v);changed=true}};if(t==='fuel'){set('portEngineHours',r.portEngineHours);set('starboardEngineHours',r.starboardEngineHours)}else{let side=r.engineSide;if(side==='Port engine'||side==='Both engines')set('portEngineHours',r.engineHours);if(side==='Starboard engine'||side==='Both engines')set('starboardEngineHours',r.engineHours);if(side==='Generator')set('generatorHours',r.engineHours)}if(changed)b.hoursUpdatedAt=today();return changed}
async function removeRecord(t,id){let r=state[t].find(x=>x.id===id);if(!r)return;if(!confirm(t==='boats'?'Delete this boat and all its records and uploaded files? This cannot be undone.':'Delete this record? This cannot be undone.'))return;try{let next=draft();next[t]=next[t].filter(x=>x.id!==id);if(t==='boats'){if(!next.boats.length)throw new Error('Keep at least one boat.');for(let k of ['maintenance','documents','expenses','fuel','alerts'])next[k]=next[k].filter(x=>x.boatId!==id);next.activeBoat=next.boats[0].id}await persist(next);render();toast('Record deleted.')}catch(e){toast('Could not delete: '+e.message)}}
async function setReminder(t,id,statusValue){let src=state[t]?.find(x=>x.id===id);if(statusValue==='completed'&&src){if(t==='maintenance'&&(Number(src.intervalMonths)>0||Number(src.intervalHours)>0)){let h=currentHours(src.engineSide);return edit('maintenance',null,{engineSide:src.engineSide,serviceType:src.serviceType,vendorName:src.vendorName,intervalMonths:src.intervalMonths,intervalHours:src.intervalHours,includeInTotals:src.includeInTotals,currency:src.currency,fxRate:src.fxRate,engineHours:h??''},id)}if(t==='alerts'&&(Number(src.repeatMonths)>0||Number(src.repeatHours)>0)){try{let next=draft(),n={...src,id:uid(),status:'open',updatedAt:new Date().toISOString()};n.dueDate=Number(src.repeatMonths)>0&&src.dueDate?addMonths(src.dueDate,Number(src.repeatMonths)):Number(src.repeatHours)>0?'':src.dueDate;if(Number(src.repeatHours)>0&&knownHours(src.dueEngineHours))n.dueEngineHours=Number(src.dueEngineHours)+Number(src.repeatHours);if(!n.dueDate&&!knownHours(n.dueEngineHours))n.dueDate=src.dueDate;next.alerts.find(x=>x.id===id).status='completed';next.alerts.push(n);await persist(next);render();toast('Completed. Next one scheduled'+(n.dueDate?' for '+date(n.dueDate):'')+(knownHours(n.dueEngineHours)&&n.dueEngineHours!==src.dueEngineHours?' at '+num(n.dueEngineHours)+' h':'')+'.')}catch(e){toast('Could not save reminder.')}return}}try{let next=draft(),r=next[t].find(x=>x.id===id);r[t==='alerts'?'status':'reminderStatus']=statusValue;await persist(next);render();toast('Reminder updated.')}catch(e){toast('Could not save reminder.')}}

function backupAge(){let d=state.preferences.lastBackup;return d?Math.round((new Date(today()+'T12:00:00')-new Date(d+'T12:00:00'))/86400000):null}
function hasData(){return ['maintenance','documents','expenses','fuel','alerts'].some(t=>state[t].length)||!!state.logbook?.passages?.length}
async function storageInfo(){let el=$('#storageInfo');if(!el)return;try{let est=await navigator.storage.estimate(),kept=await navigator.storage.persisted?.();el.textContent=`Using ${num((est.usage||0)/1048576)} MB of browser storage${est.quota?` (about ${num(est.quota/1073741824)} GB available)`:''}. ${kept?'This browser has agreed to keep BoatVault data protected from automatic cleanup.':'This browser may clear site data when disk space is low — keep regular backups.'}`}catch(e){el.textContent='Storage details are not available in this browser.'}}
function validBackup(x){if(!x||x.version!==1||!Array.isArray(x.boats)||!x.boats.length||!x.preferences||!Number.isFinite(Number(x.preferences.reminderWindow))||Number(x.preferences.reminderWindow)<0||Number(x.preferences.reminderWindow)>365)throw new Error('This is not a supported BoatVault backup.');let ids=new Set();for(let b of x.boats){if(typeof b.id!=='string'||typeof b.boatName!=='string'||!b.boatName||ids.has(b.id))throw new Error('Invalid boat profile in backup.');ids.add(b.id)}for(let t of ['maintenance','documents','expenses','fuel','alerts']){if(!Array.isArray(x[t]))throw new Error('Missing '+t+' records.');let recordIds=new Set();for(let r of x[t]){if(!r||typeof r.id!=='string'||recordIds.has(r.id)||!ids.has(r.boatId))throw new Error('Invalid record in '+t);recordIds.add(r.id);if(r.attachments!=null&&(!Array.isArray(r.attachments)||r.attachments.some(a=>!a||typeof a.name!=='string'||typeof a.data!=='string'||!/^data:(application\/pdf|image\/(png|jpeg|webp));base64,/.test(a.data))))throw new Error('Invalid receipt attachment in backup.');for(let [k,l,type,required] of schemas[t]){if(k==='file')continue;if(type==='checkbox'&&r[k]!=null&&typeof r[k]!=='boolean')throw new Error('Invalid spending inclusion setting.');if(required&&(r[k]==null||r[k]===''))throw new Error('Missing '+l+' in backup.');if(type==='number'&&r[k]!==''&&r[k]!=null&&(!Number.isFinite(Number(r[k]))||Number(r[k])<0))throw new Error('Invalid '+l+' in backup.');if(type==='date'&&r[k]&&!/^\d{4}-\d{2}-\d{2}$/.test(r[k]))throw new Error('Invalid date in backup.')}if(t==='documents'&&(typeof r.fileData!=='string'||!/^data:(application\/pdf|image\/(png|jpeg));base64,/.test(r.fileData)))throw new Error('Unsupported document in backup.');if(t==='fuel'&&(!Number.isFinite(Number(r.totalCost))||Number(r.totalCost)<0))throw new Error('Invalid fuel cost.');if(t==='alerts'&&!['open','completed','dismissed'].includes(r.status))throw new Error('Invalid reminder status.')}}if(!ids.has(x.activeBoat))x.activeBoat=x.boats[0].id;return x}
$('#restoreFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{if(file.size>200*1024*1024)throw new Error('Backup is too large for this edition.');let x=JSON.parse(await file.text()),next,msg;if(x&&x.app==='kismet-logbook'){let L=validateLog(x);delete L.exportedAt;if(!confirm('Restore this Captain’s Logbook backup ('+L.passages.length+' passages, '+L.certifications.length+' certifications)?\n\nOnly the captain’s log is replaced. Boats, maintenance, documents, expenses, fuel and reminders stay exactly as they are.'))return;next=draft();next.logbook=L;msg='Captain’s log restored. Vessel records unchanged.'}else{let hasLog=!!(x&&x.logbook);next=migrateEngines(validBackup(x));if(hasLog)next.logbook=validateLog(next.logbook);else next.logbook=state.logbook;if(!confirm(hasLog?'Restore this complete backup? It replaces every boat, record, file AND the captain’s log on this browser.':'Restore this BoatVault backup? It replaces boats, maintenance, documents, expenses, fuel and reminders.\n\nYour captain’s log is not in this backup, so it is kept as it is.'))return;msg=hasLog?'Complete backup restored.':'BoatVault records restored. Captain’s log kept.'}await persist(next);render();toast(msg)}catch(err){toast('Restore failed: '+err.message)}finally{e.target.value=''}};
function csvExport(){let b=boat(),lines=[['BoatVault',b.boatName],['Exported',today()]];for(let t of ['maintenance','documents','expenses','fuel','alerts']){lines.push([], [labels[t]]);let fields=schemas[t].filter(s=>s[0]!=='file'&&s[2]!=='attachments').map(s=>s[0]);if(t==='documents')fields.push('fileName','fileSize');if(t==='fuel')fields.push('totalCost');lines.push(fields);records(t).forEach(r=>lines.push(fields.map(k=>r[k]??'')))}let content='\ufeff'+lines.map(l=>l.map(v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob([content],{type:'text/csv;charset=utf-8'}),'BoatVault_'+b.boatName.replace(/[^a-z0-9_-]/gi,'_')+'_'+today()+'.csv')}
async function saveWindow(){let n=Number($('#windowDays').value);if(!Number.isInteger(n)||n<0||n>365)return toast('Enter a whole number between 0 and 365.');try{let next=draft();next.preferences.reminderWindow=n;await persist(next);toast('Reminder window saved.')}catch(e){toast('Could not save setting.')}}
function printReport(){let original=view;$('#heading').textContent=boat().boatName+' • Vessel report';query='';$('#content').innerHTML=profile()+['maintenance','fuel'].map(t=>`<section class="card" style="margin-top:20px"><h2>${labels[t]}</h2>${table(t)}</section>`).join('')+`<section class="card" style="margin-top:20px"><h2>All-time spending: ${money(spendingTotal(spendingEntries()))}</h2>${spendingTable(spendingEntries())}</section>`+`<section class="card" style="margin-top:20px"><h2>Document inventory</h2>${records('documents').map(r=>`<div class="row"><div><strong>${esc(r.documentName)}</strong><small>${esc(r.category)} · ${esc(r.fileName)}</small></div><span>${r.expirationDate?'Expires '+date(r.expirationDate):''}</span></div>`).join('')||'<p>No documents.</p>'}</section>`+alertsView();setTimeout(()=>{window.print();view=original;render()},100)}
$('#boatSelect').onchange=async e=>{try{let next=draft();next.activeBoat=e.target.value;await persist(next);query='';render()}catch(e){toast('Could not change boat.')}};
(async()=>{try{db=await openDB();state=await new Promise((resolve,reject)=>{let q=db.transaction('data').objectStore('data').get('state');q.onsuccess=()=>resolve(q.result||fresh());q.onerror=()=>reject(q.error)});migrateEngines(state);if(!state.logbook)state.logbook=initialLog();await persist();try{navigator.storage?.persist?.()}catch(e){}await loadSyncCfg();render();showSync();if(syncCfg)scheduleSync(800);addEventListener('online',()=>scheduleSync(1500));addEventListener('offline',()=>{if(syncCfg){syncMsg='Offline • changes will sync when you are back online';showSync()}});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')scheduleSync(1000)});setInterval(()=>scheduleSync(0),5*60000);if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){$('#content').innerHTML='<section class="card"><h2>Browser storage is unavailable</h2><p>Open BoatVault in a regular browser tab with website storage enabled. Private browsing or an HTML preview may prevent saving records.</p></section>';$('#saveState').textContent='Records cannot be saved in this browser.'}})();
</script></body></html>
